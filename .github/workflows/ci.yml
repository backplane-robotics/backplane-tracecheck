name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the full test suite before publishing.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to exact commits (the tag is in the comment); Dependabot proposes updates.
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        # Oldest supported mcap (used to write the examples), plus the 1.6 line that Foxglove's SDK now requires.
        mcap: ["1.5.0"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            mcap: "1.6.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "mcap==${{ matrix.mcap }}"
      # Rules are in pyproject.toml ([tool.ruff.lint]), the same as a local `ruff check .`.
      - run: python -m ruff check .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The web tests compare full reports against the Python engine in ./.venv
      - run: python -m venv .venv && .venv/bin/pip install -e .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
